spring:
  application:
    name: cashier-withdrawals
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/cashier
    username: ${DB_USER:cashier}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000

cashier:
  fee:
    percent: 2.5
    minimum: 1.00
  fx:
    base-url: ${FX_BASE_URL:http://fx-rates:8080}
    connect-timeout: 500ms
    read-timeout: 2s
  topics:
    withdrawals: cashier.withdrawal-requested.v1
  outbox:
    poll-interval: 500ms
