spring:
  application:
    name: cashier-withdrawals
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/cashier
    username: ${DB_USER:cashier}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

cashier:
  fee:
    percent: 2.5
    minimum: 1.00
  fx:
    base-url: ${FX_BASE_URL:http://fx-rates:8080}
    connect-timeout: 500ms
    read-timeout: 2s
  topics:
    withdrawals: cashier.withdrawal-requested.v1
