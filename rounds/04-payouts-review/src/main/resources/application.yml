spring:
  application:
    name: payouts
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/payouts
    username: ${DB_USER:payouts}
    password: ${DB_PASSWORD:payouts}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: false
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: "*"

payouts:
  fee:
    percent: 2.5
    minimum: 1.00
  psp:
    base-url: ${PSP_BASE_URL:https://psp.example.invalid}
  webhook:
    secret: ${PSP_WEBHOOK_SECRET:changeme}
  topics:
    withdrawal-events: payouts.withdrawal-events.v1
    risk-decisions: risk.withdrawal-decisions.v1
